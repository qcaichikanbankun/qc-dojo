<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC道場 - ポップ教育アプリ</title>
    <style>
        :root { --primary: #ff6b6b; --accent: #4ecdc4; --bg: #f7fff7; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: #333; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: var(--primary); }
        .btn { padding: 15px 25px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s; color: white; background: var(--primary); margin: 5px; }
        .btn:hover { transform: scale(1.05); }
        .item { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        #game-img { width: 100%; max-width: 400px; border-radius: 15px; margin: 20px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .result-item { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; background: white; padding: 15px; border-radius: 15px; border-left: 8px solid var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 QC道場</h1>
    <button class="btn" onclick="showMode('admin')">🛠 管理・編集</button>
    <button class="btn" style="background:var(--accent)" onclick="showMode('train')">🎮 トレーニング開始</button>
</div>

<div id="admin-mode" class="card" style="display:none;">
    <h2>品番を編集・追加</h2>
    <input type="text" id="part-name" placeholder="品番を入力" style="padding:10px; border-radius:10px; border:1px solid #ccc;">
    <button class="btn" style="background:#555;" onclick="loadPartForEdit()">読み込み</button>
    <input type="file" id="admin-upload" accept="image/*" multiple style="margin: 20px 0;">
    <div id="admin-preview"></div>
    <button class="btn" onclick="saveData()">保存する</button>
</div>

<div id="train-mode" class="card" style="display:none;">
    <h2>トレーニング選択</h2>
    <select id="part-select" onchange="loadPart()" style="padding:10px; border-radius:10px;"></select>
    <div id="game-area"></div>
</div>

<script>
    // --- 画像リサイズ機能 ---
    function resizeImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxW = 400; 
                const scale = maxW / img.width;
                canvas.width = maxW; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- 管理：登録・編集UI ---
    document.getElementById('admin-upload').addEventListener('change', (e) => {
        for (let file of e.target.files) {
            resizeImage(file, (data) => addRow(data, "OK"));
        }
    });

    function addRow(src, label) {
        const id = 's_' + Math.random().toString(36).substr(2, 9);
        document.getElementById('admin-preview').innerHTML += `<div class="item">
            <img src="${src}" style="width:60px; height:60px; object-fit:cover; border-radius:10px;">
            <select id="${id}" data-src="${src}">
                <option ${label==='OK'?'selected':''}>OK</option>
                <option ${label==='キズ'?'selected':''}>キズ</option>
                <option ${label==='バリ'?'selected':''}>バリ</option>
                <option ${label==='ヒケ'?'selected':''}>ヒケ</option>
                <option ${label==='ショート'?'selected':''}>ショート</option>
                <option ${label==='シルバー'?'selected':''}>シルバー</option>
            </select>
            <button class="btn" style="background:#ff6b6b; padding:5px 10px;" onclick="this.parentElement.remove()">削除</button>
        </div>`;
    }

    function saveData() {
        const name = document.getElementById('part-name').value;
        const data = Array.from(document.querySelectorAll('#admin-preview .item')).map(div => ({
            src: div.querySelector('select').dataset.src,
            label: div.querySelector('select').value
        }));
        localStorage.setItem('qc_data_' + name, JSON.stringify(data));
        alert("保存しました！");
    }

    function loadPartForEdit() {
        const name = document.getElementById('part-name').value;
        const data = JSON.parse(localStorage.getItem('qc_data_' + name));
        if(!data) return alert("データが見つかりません");
        document.getElementById('admin-preview').innerHTML = "";
        data.forEach(d => addRow(d.src, d.label));
    }

    // --- トレーニング：ゲームロジック ---
    let currentData = [], idx = 0, score = 0, results = [];
    
    function showMode(mode) {
        document.getElementById('admin-mode').style.display = mode === 'admin' ? 'block' : 'none';
        document.getElementById('train-mode').style.display = mode === 'train' ? 'block' : 'none';
        if(mode === 'train') {
            const s = document.getElementById('part-select');
            s.innerHTML = '<option>品番を選択...</option>';
            for(let i=0; i<localStorage.length; i++) {
                const k = localStorage.key(i);
                if(k.startsWith('qc_data_')) s.innerHTML += `<option value="${k}">${k.replace('qc_data_','')}</option>`;
            }
        }
    }

    function loadPart() {
        currentData = JSON.parse(localStorage.getItem(document.getElementById('part-select').value));
        idx = 0; score = 0; results = [];
        playNext();
    }

    function playNext() {
        const area = document.getElementById('game-area');
        if(idx >= currentData.length) {
            area.innerHTML = `<h3>結果発表！正解数: ${score}/${currentData.length}</h3>` + results.map((r,i) => `
                <div class="result-item">
                    <img src="${r.src}" style="width:50px;height:50px;object-fit:cover;border-radius:10px;">
                    <span>${i+1}問目: ${r.isCorrect?'⭕️':'❌'} (${r.label})</span>
                </div>`).join('');
            return;
        }
        area.innerHTML = `<img id="game-img" src="${currentData[idx].src}"><br>
            <button class="btn" style="background:var(--accent)" onclick="check('OK')">OK</button>
            <button class="btn" style="background:var(--primary)" onclick="check('NG')">NG</button>`;
    }

    function check(ans) {
        const correct = currentData[idx].label === 'OK' ? 'OK' : 'NG';
        results.push({...currentData[idx], isCorrect: ans === correct, myAns: ans});
        if(ans === correct) score++;
        idx++;
        playNext();
    }
</script>
</body>
</html>
