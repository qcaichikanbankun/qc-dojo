<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC道場 - トレーニング</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #222; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 15px; background: #333; text-align: center; font-weight: bold; font-size: 1.2rem; }
        #game-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .card { width: 90%; max-width: 400px; height: 60vh; background: #fff; border-radius: 20px; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .img-container { width: 100%; height: 70%; background: #eee; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        #btn-area { display: flex; gap: 10px; padding: 20px; }
        .btn { flex: 1; padding: 20px; font-size: 1.5rem; font-weight: 900; border: none; border-radius: 15px; color: white; cursor: pointer; }
        #settings-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:white; color:black; z-index:1000; padding:20px; box-sizing:border-box; overflow-y:auto; }
        #result-screen { display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
    </style>
</head>
<body>

<div id="header">QC道場 - 外観検査トレーニング</div>

<div id="settings-modal">
    <h2>1. 検査モードを選択</h2>
    <div id="image-selector"></div>
    <button class="btn" style="background:#007bff; margin-top:20px; width:100%;" onclick="startCustomGame()">開始する</button>
</div>

<div id="game-area">
    <div id="card-container"></div>
</div>

<div id="btn-area">
    <button class="btn" style="background:#dc3545;" onclick="handleSwipe('NG')">NG</button>
    <button class="btn" style="background:#28a745;" onclick="handleSwipe('OK')">OK</button>
</div>

<div id="result-screen">
    <h1>トレーニング終了！</h1>
    <div id="final-score" style="font-size:2rem; margin:20px;"></div>
    <button class="btn" style="background:#6c757d;" onclick="location.reload()">最初からやり直す</button>
</div>

<script>
    const allQuestions = [
        { label: "良品", type: "OK", img: "img/ok_01.jpg" },
        { label: "ショート", type: "NG", img: "img/short_01.jpg" },
        { label: "シルバー", type: "NG", img: "img/silver_01.jpg" }
    ];

    let gameQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 設定画面の生成
    const selector = document.getElementById("image-selector");
    allQuestions.forEach((q, i) => {
        selector.innerHTML += `<div style="padding:10px; border-bottom:1px solid #ccc;">
            <input type="checkbox" id="q${i}" checked> <label for="q${i}">${q.label}</label>
        </div>`;
    });

    function startCustomGame() {
        gameQuestions = allQuestions.filter((_, i) => document.getElementById(`q${i}`).checked);
        if(gameQuestions.length === 0) return alert("最低1つは選んでください");
        document.getElementById("settings-modal").style.display = "none";
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= gameQuestions.length) {
            document.getElementById("game-area").style.display = "none";
            document.getElementById("btn-area").style.display = "none";
            document.getElementById("result-screen").style.display = "flex";
            document.getElementById("final-score").innerText = `正解数: ${score} / ${gameQuestions.length}`;
            return;
        }

        const q = gameQuestions[currentIndex];
        document.getElementById("card-container").innerHTML = `
            <div class="card">
                <div class="img-container"><img src="${q.img}"></div>
                <div style="margin-top:20px;">問題 ${currentIndex + 1} / ${gameQuestions.length}</div>
            </div>`;
    }

    function handleSwipe(ans) {
        if (ans === gameQuestions[currentIndex].type) score++;
        currentIndex++;
        showQuestion();
    }
</script>
</body>
</html>
