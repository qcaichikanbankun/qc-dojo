<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>QC道場 - 品番管理・教育ツール</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        .panel { background: #333; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        .item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #555; padding-bottom: 5px; }
        #game-img { max-width: 100%; max-height: 400px; margin: 20px 0; }
        .result-item { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; background: #444; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>QC道場</h1>
        <button class="btn" onclick="showMode('admin')">管理モード</button>
        <button class="btn" onclick="showMode('train')">トレーニング開始</button>
    </div>

    <div id="admin-mode" class="panel" style="display:none;">
        <h2>品番登録</h2>
        <input type="text" id="part-name" placeholder="製品品番">
        <input type="file" id="admin-upload" accept="image/*" multiple>
        <div id="admin-list" style="margin: 20px 0;"></div>
        <button class="btn" style="background:#28a745;" onclick="saveData()">保存</button>
    </div>

    <div id="train-mode" class="panel" style="display:none;">
        <h2>トレーニング</h2>
        <select id="part-select" onchange="loadPart()" class="btn" style="background:#555;"></select>
        <div id="game-area"></div>
    </div>

    <script>
        let currentData = [];
        let currentIndex = 0;
        let results = []; // 回答結果を保存用

        function showMode(mode) {
            document.getElementById('admin-mode').style.display = mode === 'admin' ? 'block' : 'none';
            document.getElementById('train-mode').style.display = mode === 'train' ? 'block' : 'none';
            if(mode === 'train') updatePartList();
        }

        document.getElementById('admin-upload').addEventListener('change', function(e) {
            const list = document.getElementById('admin-list');
            for (let file of e.target.files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const id = 's_' + Math.random();
                    list.innerHTML += `<div class="item">
                        <img src="${event.target.result}" style="width:50px; height:50px; object-fit:cover;">
                        <select id="${id}" data-src="${event.target.result}">
                            <option value="OK">良品</option>
                            <option value="ショート">ショート</option>
                            <option value="シルバー">シルバー</option>
                            <option value="キズ">キズ</option>
                            <option value="バリ">バリ</option>
                            <option value="ヒケ">ヒケ</option>
                        </select>
                    </div>`;
                }
                reader.readAsDataURL(file);
            }
        });

        function saveData() {
            const name = document.getElementById('part-name').value;
            const selects = document.querySelectorAll('#admin-list select');
            const data = Array.from(selects).map(s => ({ src: s.dataset.src, label: s.value }));
            localStorage.setItem('qc_data_' + name, JSON.stringify(data));
            alert("保存完了");
        }

        function updatePartList() {
            const s = document.getElementById('part-select');
            s.innerHTML = '<option>品番を選択...</option>';
            for(let i=0; i<localStorage.length; i++) {
                const k = localStorage.key(i);
                if(k.startsWith('qc_data_')) s.innerHTML += `<option value="${k}">${k.replace('qc_data_','')}</option>`;
            }
        }

        function loadPart() {
            currentData = JSON.parse(localStorage.getItem(document.getElementById('part-select').value));
            currentIndex = 0;
            results = [];
            playNext();
        }

        function playNext() {
            const area = document.getElementById('game-area');
            if(currentIndex >= currentData.length) {
                showResults();
                return;
            }
            const q = currentData[currentIndex];
            area.innerHTML = `<img id="game-img" src="${q.src}"><br>
                <button class="btn" onclick="checkAns('OK')">OK</button>
                <button class="btn" onclick="checkAns('NG')">NG</button>`;
        }

        function checkAns(ans) {
            const correct = (currentData[currentIndex].label === 'OK' ? 'OK' : 'NG');
            results.push({ ...currentData[currentIndex], myAns: ans, isCorrect: (ans === correct) });
            currentIndex++;
            playNext();
        }

        function showResults() {
            const area = document.getElementById('game-area');
            let html = `<h3>結果一覧</h3>`;
            results.forEach((r, i) => {
                html += `<div class="result-item">
                    <img src="${r.src}" style="width:50px;height:50px;object-fit:cover;">
                    <span>${i+1}問目: ${r.isCorrect ? '⭕️正解' : '❌不正解'} (正解: ${r.label})</span>
                </div>`;
            });
            area.innerHTML = html;
        }
    </script>
</body>
</html>
